<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Animal Quiz – Generate Archive</title>
  <style>
    body { font-family: monospace; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #2E7D32; }
    button { padding: 12px 24px; font-size: 16px; background: #2E7D32; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: default; }
    #log { background: #111; color: #0f0; padding: 16px; border-radius: 6px; white-space: pre-wrap; min-height: 200px; font-size: 13px; margin: 20px 0; }
    #download { display: none; padding: 12px 24px; font-size: 16px; background: #1565C0; color: #fff; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; }
    .instructions { background: #fff3cd; border: 1px solid #ffc107; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; }
  </style>
</head>
<body>

<h1>Animal Quiz – Generate animals.json</h1>

<div class="instructions">
  <strong>Postup:</strong><br>
  1. Klikni "Start" – script stiahne ~700 zvierat z Wikidata (7 kontinent × 100)<br>
  2. Po skončení klikni "Download animals.json"<br>
  3. Uložený súbor presuň do priečinka <code>data/</code> v projekte
</div>

<button id="btnStart">▶ Start – Generate animals.json</button>
<pre id="log">Čakám na spustenie…</pre>
<a id="download">⬇ Download animals.json</a>

<script>
const CONTINENTS = [
  { qid: 'Q15',  name: 'Africa'        },
  { qid: 'Q48',  name: 'Asia'          },
  { qid: 'Q46',  name: 'Europe'        },
  { qid: 'Q49',  name: 'North America' },
  { qid: 'Q18',  name: 'South America' },
  { qid: 'Q538', name: 'Australia'     },
  { qid: 'Q51',  name: 'Antarctica'    },
];

const LIMIT = 100;
const log = document.getElementById('log');

function print(msg) {
  log.textContent += '\n' + msg;
  log.scrollTop = log.scrollHeight;
}

function buildQuery(qid) {
  return `
SELECT DISTINCT ?animal ?label ?image ?sciName WHERE {
  ?animal wdt:P31  wd:Q16521 ;
          wdt:P105 wd:Q7432  ;
          wdt:P18  ?image    ;
          wdt:P30  wd:${qid} .
  ?en schema:about    ?animal ;
      schema:isPartOf <https://en.wikipedia.org/> ;
      schema:name     ?label .
  OPTIONAL { ?animal wdt:P225 ?sciName . }
}
LIMIT ${LIMIT}`.trim();
}

function buildImageUrl(raw) {
  return raw.replace(/^http:\/\//, 'https://') + '?width=500';
}

async function fetchContinent(continent) {
  const url = 'https://query.wikidata.org/sparql?format=json&query=' +
    encodeURIComponent(buildQuery(continent.qid));

  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await fetch(url, { headers: { Accept: 'application/sparql-results+json' } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      return data.results.bindings
        .filter(b => b.label?.value && b.image?.value && b.animal?.value)
        .map(b => ({
          id:        b.animal.value,
          label:     b.label.value,
          imageUrl:  buildImageUrl(b.image.value),
          continent: continent.name,
          sciName:   b.sciName?.value || null,
        }));
    } catch (err) {
      if (attempt < 3) {
        print(`  ⚠ Pokus ${attempt} zlyhal: ${err.message}. Čakám 2s…`);
        await new Promise(r => setTimeout(r, 2000));
      } else {
        throw err;
      }
    }
  }
}

document.getElementById('btnStart').addEventListener('click', async () => {
  const btn = document.getElementById('btnStart');
  btn.disabled = true;
  log.textContent = 'Štartujem…';

  const allAnimals = [];
  const seenIds = new Set();

  for (const continent of CONTINENTS) {
    print(`\nSťahujem: ${continent.name} (${continent.qid})…`);
    try {
      const animals = await fetchContinent(continent);
      let added = 0;
      for (const a of animals) {
        if (!seenIds.has(a.id)) {
          seenIds.add(a.id);
          allAnimals.push(a);
          added++;
        }
      }
      print(`  ✓ ${continent.name}: ${added} unikátnych (${animals.length} raw)`);
    } catch (err) {
      print(`  ✗ Zlyhalo pre ${continent.name}: ${err.message}`);
    }
    // Polite pause between requests
    await new Promise(r => setTimeout(r, 800));
  }

  print(`\n=== HOTOVO ===`);
  print(`Celkovo unikátnych zvierat: ${allAnimals.length}`);

  if (allAnimals.length < 15) {
    print('✗ Príliš málo zvierat! Skontroluj internetové pripojenie.');
    btn.disabled = false;
    return;
  }

  const json = JSON.stringify(allAnimals, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);

  const dl = document.getElementById('download');
  dl.href = url;
  dl.download = 'animals.json';
  dl.style.display = 'inline-block';
  print('\n⬇ Klikni "Download animals.json" a presuň súbor do priečinka data/');
});
</script>
</body>
</html>
