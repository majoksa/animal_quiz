<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Animal Quiz – Generate Archive</title>
  <style>
    body { font-family: monospace; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #2E7D32; }
    button { padding: 12px 24px; font-size: 16px; background: #2E7D32; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: default; }
    #log { background: #111; color: #0f0; padding: 16px; border-radius: 6px; white-space: pre-wrap; min-height: 200px; font-size: 13px; margin: 20px 0; }
    #download { display: none; padding: 12px 24px; font-size: 16px; background: #1565C0; color: #fff; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; }
    .instructions { background: #fff3cd; border: 1px solid #ffc107; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; }
  </style>
</head>
<body>

<h1>Animal Quiz – Generate animals.json</h1>

<div class="instructions">
  <strong>Postup:</strong><br>
  1. Klikni "Start" – script stiahne až 500 zvierat z Wikidata (en.wikipedia)<br>
  2. Po skončení klikni "Download animals.json"<br>
  3. Uložený súbor presuň do priečinka <code>data/</code> v projekte
</div>

<button id="btnStart">▶ Start – Generate animals.json</button>
<pre id="log">Čakám na spustenie…</pre>
<a id="download">⬇ Download animals.json</a>

<script>
const log = document.getElementById('log');

function print(msg) {
  log.textContent += '\n' + msg;
  log.scrollTop = log.scrollHeight;
}

/*
 * Single broad query – no continent filter.
 * wdt:P30 ?continent  gets ANY continent; SERVICE label gives English name.
 * Previous approach (7 × per-continent QID) returned 0 for most continents
 * because most animal entries in Wikidata don't have P30 set to the top-level
 * continent entity (they may use sub-regions or skip P30 altogether).
 * This broad query matches anything with P30 set and gets the label via SERVICE.
 */
const SPARQL_QUERY = `
SELECT DISTINCT ?animal ?label ?image ?continentLabel ?sciName WHERE {
  ?animal wdt:P31  wd:Q16521 ;
          wdt:P105 wd:Q7432  ;
          wdt:P18  ?image    ;
          wdt:P30  ?continent .

  ?en schema:about    ?animal ;
      schema:isPartOf <https://en.wikipedia.org/> ;
      schema:name     ?label .

  OPTIONAL { ?animal wdt:P225 ?sciName . }

  SERVICE wikibase:label { bd:serviceParam wikibase:language "en" . }

  BIND(MD5(CONCAT(STR(RAND()), STR(?animal))) AS ?rand)
}
ORDER BY ?rand
LIMIT 500
`.trim();

function buildImageUrl(raw) {
  return raw.replace(/^http:\/\//, 'https://') + '?width=500';
}

async function fetchAnimals() {
  const url = 'https://query.wikidata.org/sparql?format=json&query=' +
    encodeURIComponent(SPARQL_QUERY);

  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      print(`  Pokus ${attempt}: posielam dotaz na Wikidata…`);
      const res = await fetch(url, { headers: { Accept: 'application/sparql-results+json' } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return data.results.bindings;
    } catch (err) {
      if (attempt < 3) {
        print(`  ⚠ Zlyhalo: ${err.message}. Čakám 3s…`);
        await new Promise(r => setTimeout(r, 3000));
      } else {
        throw err;
      }
    }
  }
}

document.getElementById('btnStart').addEventListener('click', async () => {
  const btn = document.getElementById('btnStart');
  btn.disabled = true;
  log.textContent = 'Štartujem…';

  let bindings;
  try {
    bindings = await fetchAnimals();
  } catch (err) {
    print(`✗ Chyba: ${err.message}`);
    btn.disabled = false;
    return;
  }

  print(`  Wikidata vrátila ${bindings.length} riadkov, spracúvam…`);

  const seenIds = new Set();
  const allAnimals = [];

  for (const b of bindings) {
    const id        = b.animal?.value;
    const label     = b.label?.value;
    const image     = b.image?.value;
    const continent = b.continentLabel?.value;
    const sciName   = b.sciName?.value || null;

    if (!id || !label || !image || !continent) continue;
    // Skip entries where continent label is still a QID (no label found)
    if (/^Q\d+$/.test(continent)) continue;
    if (seenIds.has(id)) continue;

    seenIds.add(id);
    allAnimals.push({ id, label, imageUrl: buildImageUrl(image), continent, sciName });
  }

  print(`\n=== HOTOVO ===`);
  print(`Unikátnych zvierat: ${allAnimals.length}`);

  // Summary by continent
  const byCont = {};
  for (const a of allAnimals) byCont[a.continent] = (byCont[a.continent] || 0) + 1;
  for (const [c, n] of Object.entries(byCont).sort((x,y) => y[1]-x[1])) {
    print(`  ${c}: ${n}`);
  }

  if (allAnimals.length < 15) {
    print('\n✗ Príliš málo zvierat! Skontroluj internetové pripojenie.');
    btn.disabled = false;
    return;
  }

  const json = JSON.stringify(allAnimals, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);

  const dl = document.getElementById('download');
  dl.href = url;
  dl.download = 'animals.json';
  dl.style.display = 'inline-block';
  print('\n⬇ Klikni "Download animals.json" a presuň súbor do priečinka data/');
});
</script>
</body>
</html>
