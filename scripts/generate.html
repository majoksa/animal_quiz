function translateHabitat(value, map) {
  if (Array.isArray(value)) return value.map(v => map[v] || v);
  return map[value] || value;
}

async function translateText(text, sessionEmail) {
  if (!text) return text;
  try {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|sk&de=${encodeURIComponent(sessionEmail)}`;
    const res = await fetch(url);
    if (!res.ok) return text;
    const data = await res.json();
    const translated = data?.responseData?.translatedText;
    if (!translated || translated.startsWith('MYMEMORY WARNING')) return text;
    return translated;
  } catch { return text; }
}

function buildImageUrl(summary) {
  // Prefer originalimage (full, uncropped) – fall back to widened thumbnail
  if (summary.originalimage?.source) return summary.originalimage.source;
  if (summary.thumbnail?.source) return summary.thumbnail.source.replace(/\/\d+px-/, '/800px-');
  return null;
}

function extractFact(summary) {
  const extract = summary.extract || '';
  // Take first sentence
  const first = extract.split(/\.\s+/)[0];
  if (!first || first.length < 30) return null;
  // Remove parentheticals like "(Panthera leo)" or "(also known as...)"
  let fact = first.replace(/\s*\([^)]*\)/g, '').trim();
  if (!fact.endsWith('.')) fact += '.';
  return fact.length >= 30 ? fact : null;
}

async function fetchWikiSummary(title, retries = 3) {
  const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
  for (let attempt = 1; attempt <= retries; attempt++) {
    try {
      const res = await fetch(url);
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (err) {
      if (attempt === retries) return null;
      await new Promise(r => setTimeout(r, 1000 * attempt));
    }
  }
  return null;
}

document.getElementById('btnStart').addEventListener('click', async () => {
  const btn = document.getElementById('btnStart');
  btn.disabled = true;
  log.textContent = `Štartujem… celkovo ${ANIMALS_SEED.length} zvierat\n`;

  const results = [];
  const seenTitles = new Set();
  let ok = 0, skip = 0;

  // Random email per session → fresh 50 000-char quota each run
  const sessionEmail = `quiz_${Math.random().toString(36).slice(2, 10)}@gmail.com`;

  // Process in small batches to be polite to Wikipedia API
  const BATCH = 5;
  for (let i = 0; i < ANIMALS_SEED.length; i += BATCH) {
    const batch = ANIMALS_SEED.slice(i, i + BATCH);
    await Promise.all(batch.map(async seed => {
      if (seenTitles.has(seed.name)) { skip++; return; }
      seenTitles.add(seed.name);

      const summary = await fetchWikiSummary(seed.name);
      if (!summary) {
        print(`  ✗ Nenašlo sa: ${seed.name}`);
        skip++;
        return;
      }

      const imageUrl = buildImageUrl(summary);
      if (!imageUrl) {
        print(`  – Bez obrázka: ${seed.name}`);
        skip++;
        return;
      }

      const wikidataId = summary.wikibase_item
        ? `http://www.wikidata.org/entity/${summary.wikibase_item}`
        : `https://en.wikipedia.org/wiki/${encodeURIComponent(seed.name)}`;

      const enFact = extractFact(summary);

      // Translate name and fact to Slovak
      const label = NAME_SK[seed.name] || await translateText(seed.name, sessionEmail);
      const fact = enFact ? await translateText(enFact, sessionEmail) : null;
      await new Promise(r => setTimeout(r, 50));

      results.push({
        id:        wikidataId,
        label:     label,
        imageUrl,
        continent: translateHabitat(seed.continent, CONTINENT_SK),
        sciName:   seed.sciName,
        fact:      fact || enFact || null,
        ...(seed.ocean ? { ocean: translateHabitat(seed.ocean, OCEAN_SK) } : {}),
      });
      ok++;
    }));

    print(`Spracované: ${Math.min(i + BATCH, ANIMALS_SEED.length)} / ${ANIMALS_SEED.length}  (ok: ${ok})`);
    // Small pause between batches
    await new Promise(r => setTimeout(r, 200));
  }

  print(`\n=== HOTOVO ===`);
  print(`Úspešných: ${ok}  /  Preskočených: ${skip}`);

  const byCont = {};
  for (const a of results) byCont[a.continent] = (byCont[a.continent] || 0) + 1;
  for (const [c, n] of Object.entries(byCont).sort()) print(`  ${c}: ${n}`);

  if (results.length < 15) {
    print('\n✗ Príliš málo zvierat! Skontroluj internetové pripojenie.');
    btn.disabled = false;
    return;
  }

  const json = JSON.stringify(results, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const dl   = document.getElementById('download');
  dl.href     = URL.createObjectURL(blob);
  dl.download = 'animals.json';
  dl.style.display = 'inline-block';
  print(`\n⬇ Klikni "Download animals.json" a presuň súbor do data/`);
});
