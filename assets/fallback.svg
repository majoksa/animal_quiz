<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#E8F5E9"/>
  <!-- body -->
  <ellipse cx="200" cy="185" rx="90" ry="65" fill="#A5D6A7"/>
  <!-- head -->
  <circle cx="200" cy="110" r="52" fill="#A5D6A7"/>
  <!-- ears -->
  <ellipse cx="160" cy="72" rx="18" ry="26" fill="#81C784" transform="rotate(-15 160 72)"/>
  <ellipse cx="240" cy="72" rx="18" ry="26" fill="#81C784" transform="rotate(15 240 72)"/>
  <!-- inner ears -->
  <ellipse cx="160" cy="72" rx="10" ry="16" fill="#C8E6C9" transform="rotate(-15 160 72)"/>
  <ellipse cx="240" cy="72" rx="10" ry="16" fill="#C8E6C9" transform="rotate(15 240 72)"/>
  <!-- eyes -->
  <circle cx="183" cy="104" r="9" fill="#fff"/>
  <circle cx="217" cy="104" r="9" fill="#fff"/>
  <circle cx="185" cy="105" r="5" fill="#388E3C"/>
  <circle cx="219" cy="105" r="5" fill="#388E3C"/>
  <circle cx="186" cy="104" r="2.5" fill="#1B1B1B"/>
  <circle cx="220" cy="104" r="2.5" fill="#1B1B1B"/>
  <!-- nose -->
  <ellipse cx="200" cy="122" rx="8" ry="5" fill="#66BB6A"/>
  <!-- mouth -->
  <path d="M192 127 Q200 135 208 127" stroke="#388E3C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- legs -->
  <rect x="142" y="230" width="28" height="44" rx="12" fill="#81C784"/>
  <rect x="178" y="235" width="28" height="44" rx="12" fill="#81C784"/>
  <rect x="194" y="235" width="28" height="44" rx="12" fill="#81C784"/>
  <rect x="230" y="230" width="28" height="44" rx="12" fill="#81C784"/>
  <!-- tail -->
  <path d="M288 175 Q330 160 320 130" stroke="#81C784" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- paw prints at bottom -->
  <circle cx="60" cy="268" r="9" fill="#C8E6C9"/>
  <circle cx="50" cy="252" r="5" fill="#C8E6C9"/>
  <circle cx="62" cy="248" r="5" fill="#C8E6C9"/>
  <circle cx="74" cy="252" r="5" fill="#C8E6C9"/>
  <circle cx="340" cy="268" r="9" fill="#C8E6C9"/>
  <circle cx="330" cy="252" r="5" fill="#C8E6C9"/>
  <circle cx="342" cy="248" r="5" fill="#C8E6C9"/>
  <circle cx="354" cy="252" r="5" fill="#C8E6C9"/>
  <!-- text -->
  <text x="200" y="295" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" fill="#388E3C" font-weight="700">Obrázok nie je dostupný</text>
</svg>
